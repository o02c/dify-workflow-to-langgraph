# Simple workflow for testing: start -> llm -> end
app:
  description: Simple test workflow
  icon: "\U0001F916"
  icon_background: '#FFEAD5'
  mode: workflow
  name: SimpleWorkflow
kind: app
version: 0.1.0
workflow:
  environment_variables: []
  features:
    retriever_resource:
      enabled: false
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: start-to-llm
      source: start_node
      sourceHandle: source
      target: llm_node
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: end
      id: llm-to-end
      source: llm_node
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: Workflow entry point
        title: Start
        type: start
        variables:
        - label: query
          required: true
          type: text-input
          variable: query
      id: start_node
      position:
        x: 80
        y: 282
      type: custom
    - data:
        desc: Generate response with LLM
        model:
          mode: chat
          name: gpt-4
          provider: openai
        prompt_template:
        - role: system
          text: You are a helpful assistant.
        - role: user
          text: '{{#start_node.query#}}'
        title: LLM Node
        type: llm
        variables: []
      id: llm_node
      position:
        x: 380
        y: 282
      type: custom
    - data:
        desc: Workflow output
        outputs:
        - value_selector:
          - llm_node
          - text
          variable: result
        title: End
        type: end
      id: end_node
      position:
        x: 680
        y: 282
      type: custom
